.chat-shell{height:calc(100dvh - 132px);min-height:0;max-height:720px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 280px;overflow:hidden}
.chat-main{min-width:0;display:flex;flex-direction:column;overflow:hidden}

function sha256Hex(text){

// 실제 저장은 현장·공정·발주·추가공사·일정 항목별 문서로 나눕니다.
var NORMALIZED_KEYS=['sites','reports','plans','events','checks'];
var normalizedCache={};
var normalizedMigrationCount=0;
function isNormalizedKey(key){return NORMALIZED_KEYS.indexOf(key)>=0;}
function normalizedIdPart(value){return encodeURIComponent(String(value||''));}
function normalizedDocId(){return 'v2__'+Array.prototype.slice.call(arguments).map(normalizedIdPart).join('__');}
function jsonClone(value){return JSON.parse(JSON.stringify(value));}
function stableJson(value){
  if(value===null||typeof value!=='object')return JSON.stringify(value);
  if(Array.isArray(value))return '['+value.map(stableJson).join(',')+']';
  return '{'+Object.keys(value).sort().map(function(key){return JSON.stringify(key)+':'+stableJson(value[key]);}).join(',')+'}';
}
function normalizedComparable(value){
  var copy=jsonClone(value||{});
  delete copy.savedAt;
  delete copy.updatedBy;
  return copy;
}
function ensureStableIds(key,data){
  if(key==='sites'&&Array.isArray(data)){
    data.forEach(function(site,siteIndex){
      if(!site.id)site.id='site_'+siteIndex;
      ['payment','scheduleItems','orderItems','extraItems'].forEach(function(field){
        (Array.isArray(site[field])?site[field]:[]).forEach(function(item,itemIndex){
          if(!item.id)item.id='legacy_'+field+'_'+itemIndex;
        });
      });
      if(site.designFee&&Array.isArray(site.designFee.items)){
        site.designFee.items.forEach(function(item,itemIndex){if(!item.id)item.id='legacy_designFeeItems_'+itemIndex;});
      }
    });
  }else if(['reports','plans','events'].indexOf(key)>=0&&Array.isArray(data)){
    data.forEach(function(item,index){if(!item.id)item.id='legacy_'+key+'_'+index;});
  }
  return data;
}
function normalizedPayloads(key,data){
  data=ensureStableIds(key,jsonClone(data));
  var map={};
  function put(id,payload){map[id]=payload;}
  if(key==='sites'){
    (Array.isArray(data)?data:[]).forEach(function(site,siteOrder){
      var siteId=site.id;
      var base=jsonClone(site);
      var designItems=base.designFee&&Array.isArray(base.designFee.items)?base.designFee.items:[];
      delete base.payment;
      delete base.scheduleItems;
      delete base.orderItems;
      delete base.extraItems;
      if(base.designFee){base.designFee=jsonClone(base.designFee);delete base.designFee.items;}
      put(normalizedDocId('site',siteId),{scope:key,type:'site',siteId:siteId,order:siteOrder,data:base});
      [
        ['payment','payment'],
        ['schedule','scheduleItems'],
        ['order','orderItems'],
        ['extra','extraItems']
      ].forEach(function(pair){
        (Array.isArray(site[pair[1]])?site[pair[1]]:[]).forEach(function(item,itemOrder){
          put(normalizedDocId(pair[0],siteId,item.id),{scope:key,type:'siteItem',kind:pair[0],siteId:siteId,itemId:item.id,order:itemOrder,data:item});
        });
      });
      designItems.forEach(function(item,itemOrder){
        put(normalizedDocId('designPayment',siteId,item.id),{scope:key,type:'siteItem',kind:'designPayment',siteId:siteId,itemId:item.id,order:itemOrder,data:item});
      });
    });
  }else if(key==='checks'){
    Object.keys(data||{}).forEach(function(siteId){
      put(normalizedDocId('checks',siteId),{scope:key,type:'siteChecks',siteId:siteId,data:data[siteId]||{}});
    });
  }else{
    (Array.isArray(data)?data:[]).forEach(function(item,order){
      put(normalizedDocId(key,item.id),{scope:key,type:'record',recordId:item.id,order:order,data:item});
    });
  }
  // 완료 표시는 마지막 묶음에 기록되어 중간에 이전이 멈춰도 불완전한 구조를 읽지 않습니다.
  put(normalizedDocId('meta',key),{scope:key,type:'meta',version:2});
  return map;
}
function hydrateNormalized(key,docs){
  var cache={};
  docs.forEach(function(entry){cache[entry.id]=normalizedComparable(entry.data);});
  normalizedCache[key]=cache;
  if(key==='sites'){
    var siteMap={},siteRows=[];
    docs.forEach(function(entry){
      var row=entry.data||{};
      if(row.type!=='site')return;
      var site=jsonClone(row.data||{});
      site.payment=[];site.scheduleItems=[];site.orderItems=[];site.extraItems=[];
      if(site.designFee){site.designFee=jsonClone(site.designFee);site.designFee.items=[];}
      siteMap[row.siteId]=site;
      siteRows.push({order:row.order||0,site:site});
    });
    var fieldByKind={payment:'payment',schedule:'scheduleItems',order:'orderItems',extra:'extraItems'};
    docs.filter(function(entry){return entry.data&&entry.data.type==='siteItem';}).sort(function(a,b){return (a.data.order||0)-(b.data.order||0);}).forEach(function(entry){
      var row=entry.data,site=siteMap[row.siteId];
      if(!site)return;
      if(row.kind==='designPayment'){
        if(!site.designFee)site.designFee={items:[]};
        if(!Array.isArray(site.designFee.items))site.designFee.items=[];
        site.designFee.items.push(jsonClone(row.data||{}));
      }else if(fieldByKind[row.kind])site[fieldByKind[row.kind]].push(jsonClone(row.data||{}));
    });
    return ensureStableIds(key,siteRows.sort(function(a,b){return a.order-b.order;}).map(function(row){return row.site;}));
  }
  if(key==='checks'){
    var state={};
    docs.forEach(function(entry){var row=entry.data||{};if(row.type==='siteChecks')state[row.siteId]=jsonClone(row.data||{});});
    return state;
  }
  return ensureStableIds(key,docs.filter(function(entry){return entry.data&&entry.data.type==='record';}).sort(function(a,b){return (a.data.order||0)-(b.data.order||0);}).map(function(entry){return jsonClone(entry.data.data||{});}));
}
function readNormalized(key){
  return requireAuth().then(function(ok){
    if(!ok)return null;
    return FIREBASE_DB.collection(FIREBASE_COLLECTION).doc(FIREBASE_DOC).collection('datasets').where('scope','==',key).get().then(function(snapshot){
      if(snapshot.empty)return null;
      var docs=[],ready=false;snapshot.forEach(function(doc){var data=doc.data()||{};if(data.type==='meta'&&data.version===2)ready=true;docs.push({id:doc.id,data:data});});
      if(!ready)return null;
      return hydrateNormalized(key,docs);
    });
  });
}
function commitNormalizedOperations(operations){
  if(!operations.length)return Promise.resolve(true);
  var groups=[];
  for(var i=0;i<operations.length;i+=400)groups.push(operations.slice(i,i+400));
  return groups.reduce(function(chain,group){
    return chain.then(function(){
      var batch=FIREBASE_DB.batch();
      group.forEach(function(operation){
        var ref=remoteDoc(operation.id);
        if(operation.remove)batch.delete(ref);
        else batch.set(ref,Object.assign({},operation.payload,{savedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:currentUser?currentUser.uid:''}));
      });
      return batch.commit();
    });
  },Promise.resolve()).then(function(){return true;});
}
function writeNormalized(key,data){
  return requireAuth().then(function(ok){
    if(!ok)return false;
    var desired=normalizedPayloads(key,data),current=normalizedCache[key]||{},operations=[];
    Object.keys(desired).forEach(function(id){
      if(!current[id]||stableJson(current[id])!==stableJson(desired[id]))operations.push({id:id,payload:desired[id]});
    });
    Object.keys(current).forEach(function(id){if(!desired[id])operations.push({id:id,remove:true});});
    return commitNormalizedOperations(operations).then(function(){normalizedCache[key]=desired;return true;});
  });
}
function readDataKey(key){
  if(!isNormalizedKey(key))return remoteRead(key);
  return readNormalized(key).then(function(value){
    if(value!==null&&value!==undefined)return value;
    return remoteRead(key).then(function(legacy){
      if(legacy===null||legacy===undefined)return null;
      ensureStableIds(key,legacy);
      setSyncStatus('syncing','데이터 저장구조 정리 중...');
      return writeNormalized(key,legacy).then(function(){normalizedMigrationCount++;return legacy;}).catch(function(err){console.warn('normalized migration failed',key,err);return legacy;});
    });
  });
}
function writeDataKey(key,data){return isNormalizedKey(key)?writeNormalized(key,data):remoteWrite(key,data);}
function sheetExtract(fileName,mediaType,base64,isDesign){
  if(!LEGACY_EXTRACT_API)return Promise.reject(new Error('extract server not configured'));
  return fetch(LEGACY_EXTRACT_API+'?action=extract',{
    method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fileName:fileName,mediaType:mediaType,data:base64,type:isDesign?'design':'construction'})
  }).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||('extract failed: '+r.status));return j;});})
  .then(function(j){if(!j||j.ok===false||!j.data)throw new Error((j&&j.error)||'extract failed');return j.data;});
}
var PDFJS_PROMISE=null;
function loadPdfJs(){
  if(PDFJS_PROMISE)return PDFJS_PROMISE;
  PDFJS_PROMISE=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs').then(function(pdfjs){
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
    return pdfjs;
  });
  return PDFJS_PROMISE;
}
function fileToBase64Payload(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var result=String(reader.result||'');
      resolve({fileName:file.name||'',mediaType:file.type||'application/octet-stream',base64:result.split(',')[1]||''});
    };
    reader.onerror=function(){reject(reader.error||new Error('파일을 읽지 못했어요'));};
    reader.readAsDataURL(file);
  });
}
function pdfFirstPageToImagePayload(file){
  return file.arrayBuffer().then(function(buffer){
    return loadPdfJs().then(function(pdfjs){
      return pdfjs.getDocument({data:new Uint8Array(buffer)}).promise;
    }).then(function(pdf){
      return pdf.getPage(1);
    }).then(function(page){
      var viewport=page.getViewport({scale:2.4});
      var canvas=document.createElement('canvas');
      var ctx=canvas.getContext('2d',{alpha:false});
      canvas.width=Math.ceil(viewport.width);
      canvas.height=Math.ceil(viewport.height);
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      return page.render({canvasContext:ctx,viewport:viewport}).promise.then(function(){
        var dataUrl=canvas.toDataURL('image/jpeg',0.88);
        return {
          fileName:String(file.name||'document.pdf').replace(/\.pdf$/i,'.jpg'),
          mediaType:'image/jpeg',
          base64:dataUrl.split(',')[1]||''
        };
      });
    });
  });
}
function setSyncStatus(state,text){
  var dot=document.getElementById('sync-dot');
  var label=document.getElementById('sync-text');
  if(dot)dot.className='sync-dot '+state;
  if(label)label.textContent=text;
}

// ── API ────────────────────────────────────────────────
function getLocalData(key,fallback){
  try{
    var raw=localStorage.getItem('smg_'+key);
    return raw?JSON.parse(raw):fallback;
  }catch(e){return fallback;}
}
function hasLocalData(key){return localStorage.getItem('smg_'+key)!==null;}
function defaultForKey(key){
  if(key==='sites')return DEFAULT_SITES;
  if(key==='reports')return DEFAULT_REPORTS;
  if(key==='plans')return DEFAULT_PLANS;
  if(key==='events')return DEFAULT_EVENTS;
  if(key==='chat')return [];
  if(key==='checks')return {};
  return [];
}
function setLocalData(key,data){
  // 마지막 정상값 백업: 원격 동기화 실패/덮어쓰기 사고 때 복구용
  var prev=localStorage.getItem('smg_'+key);
  if(prev)localStorage.setItem('smg_backup_'+key,prev);
  localStorage.setItem('smg_'+key,JSON.stringify(data));
}
function isRecentlySaved(key){
  var t=parseInt(localStorage.getItem('smg_lastSave_'+key)||'0');
  return (Date.now()-t)<120000; // 2분 이내 내 저장값은 원격값으로 덮지 않음
}
function isDeletedItem(item){return !!(item&&item.deletedAt);}
function activeList(arr){return (Array.isArray(arr)?arr:[]).filter(function(item){return !isDeletedItem(item);});}
function tombstoneItem(item){
  var nowIso=new Date().toISOString();
  return Object.assign({},item||{},{id:(item&&item.id)||uid(),deletedAt:nowIso,updatedAt:nowIso});
}
function mergeById(localArr,remoteArr){
  if(!Array.isArray(remoteArr))return localArr;
  if(!Array.isArray(localArr))localArr=[];
  var map={};
  remoteArr.forEach(function(item){
    if(item&&item.id)map[item.id]=item;
  });
  localArr.forEach(function(item){
    if(!item||!item.id)return;
    var remote=map[item.id];
    if(!remote){
      // 팀 시트가 예전 값이라 내 로컬 신규/삭제 항목이 빠진 경우 보존
      map[item.id]=item;
    }else{
      var lt=Date.parse(item.updatedAt||item.deletedAt||item.createdAt||0)||0;
      var rt=Date.parse(remote.updatedAt||remote.deletedAt||remote.createdAt||0)||0;
      if(lt>rt)map[item.id]=item;
    }
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function applyRemote(key,remote){
  if(remote===null || remote===undefined)return false;
  if(isRecentlySaved(key))return false;

  // 업무계획/보고/이벤트는 원격값으로 통째 교체하지 않고 id 기준 병합
  // 시트가 순간적으로 오래된 값을 돌려줘도 방금 입력한 항목이 사라지지 않게 함
  if(key==='reports')remote=mergeById(reports,remote);
  if(key==='plans')remote=mergeById(plans,remote);
  if(key==='events')remote=mergeById(events,remote);
  if(key==='chat')remote=mergeById(chatMessages,remote);

  setLocalData(key,remote);
  if(key==='sites')sites=remote;
  if(key==='reports')reports=remote;
  if(key==='plans')plans=remote;
  if(key==='events')events=remote;
  if(key==='chat')chatMessages=remote;
  if(key==='checks')checkState=remote;
  return true;
}

function initData(){
  if(!hasCodeAccess()){
    appStarted=false;
    setPageUnlocked(false);
    setTimeout(function(){var el=document.getElementById('access-code-input');if(el)el.focus();},50);
    return;
  }
  appStarted=true;
  setPageUnlocked(true);
  sites=ensureStableIds('sites',getLocalData('sites',DEFAULT_SITES));
  reports=ensureStableIds('reports',getLocalData('reports',DEFAULT_REPORTS));
  plans=ensureStableIds('plans',getLocalData('plans',DEFAULT_PLANS));
  events=ensureStableIds('events',getLocalData('events',DEFAULT_EVENTS));
  chatMessages=getLocalData('chat',[]);
  checkState=getLocalData('checks',{});
  renderAll();
  updateChatNotice();

  if(!hasFirebaseConfig()){
    setSyncStatus('err','Firebase 설정 필요 · 로컬 모드');
    updateAuthUI();
    return;
  }
  setSyncStatus('syncing','로그인 확인 중...');
  var keys=['sites','reports','plans','events','chat','checks'];
  var timer=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},30000);});
  Promise.race([waitForAuth().then(function(user){
    if(!user){setSyncStatus('err','입장 코드 필요 · 로컬 모드');return keys.map(function(){return null;});}
    setSyncStatus('syncing','Firebase 동기화 중...');
    normalizedMigrationCount=0;
    return Promise.all(keys.map(function(k){return readDataKey(k);}));
  }),timer])
  .then(function(res){
    var migrations=res.map(function(remote,i){
      var key=keys[i];
      if((remote===null||remote===undefined)&&hasLocalData(key)){
        var local=getLocalData(key,defaultForKey(key));
        ensureStableIds(key,local);
        return writeDataKey(key,local).then(function(){return local;});
      }
      return Promise.resolve(remote);
    });
    return Promise.all(migrations);
  }).then(function(res){
    applyRemote('sites',res[0]);
    applyRemote('reports',res[1]);
    applyRemote('plans',res[2]);
    applyRemote('events',res[3]);
    applyRemote('chat',res[4]);
    applyRemote('checks',res[5]);
    setSyncStatus('ok',normalizedMigrationCount?'새 저장구조 적용됨 ✓':'Firebase 동기화됨 ✓');
    renderAll();
    updateChatNotice();
    startChatListener();
  }).catch(function(err){console.warn(err);setSyncStatus('err','로컬 모드 · Firebase 연결 실패');});
}

var saveQueues={};
function save(key,data){
  ensureStableIds(key,data);
  var snapshot=JSON.parse(JSON.stringify(data)); // 저장 중 원본 배열이 바뀌어도 안전하게 고정
  setLocalData(key,snapshot);
  localStorage.setItem('smg_lastSave_'+key,Date.now().toString());
  if(!hasFirebaseConfig()){
    setSyncStatus('err','로컬 저장됨 · Firebase 설정 필요');
    return Promise.resolve(false);
  }
  if(!currentUser){
    setSyncStatus('err','로컬 저장됨 · 입장 코드 필요');
    return Promise.resolve(false);
  }
  setSyncStatus('syncing','Firebase 저장 중...');
  saveQueues[key]=(saveQueues[key]||Promise.resolve()).then(function(){return writeDataKey(key,snapshot);})
  .then(function(ok){
    setSyncStatus(ok?'ok':'err',ok?'Firebase 저장됨 ✓':'로컬 저장됨 · Firebase 설정 필요');
    return ok;
  }).catch(function(){setSyncStatus('err','로컬 저장됨 · Firebase 연결 실패');return false;});
  return saveQueues[key];
}

// 자동새로고침 비활성화 - 수동 동기화만 사용
function manualSync(){
  if(!hasFirebaseConfig()){
    setSyncStatus('err','Firebase 설정 필요 · 로컬 모드');
    showToast('Firebase 설정값을 먼저 입력해주세요');
    return;
  }
  if(!currentUser){
    toggleAuth();
    return;
  }
  setSyncStatus('syncing','Firebase 동기화 중...');
  var keys=['sites','reports','plans','events','chat','checks'];
  var timer=new Promise(function(_,rej){setTimeout(function(){rej(new Error('t'));},20000);});
  Promise.race([Promise.all(keys.map(function(k){return readDataKey(k);})),timer])
  .then(function(res){
    var kept=[];
    keys.forEach(function(key,i){if(!applyRemote(key,res[i])&&isRecentlySaved(key))kept.push(key);});
    setSyncStatus('ok',kept.length?'Firebase 동기화됨 ✓ (내 최근 변경 보존)':'Firebase 동기화됨 ✓');
    renderAll();
    showToast(kept.length?'Firebase 동기화 완료 — 내 최근 변경은 보존했어요':'Firebase 동기화 완료!');
  }).catch(function(){setSyncStatus('err','Firebase 동기화 실패');showToast('동기화 실패 — 로컬 데이터는 유지돼요');});
}

// ── Helpers ────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function stageBadge(s){var m={'완공':'b-완공','인테리어':'b-인테리어','착공':'b-착공','골조':'b-골조','인허가':'b-인허가','설계':'b-설계'};return '<span class="badge '+(m[s]||'b-설계')+'">'+s+'</span>';}
function avHtml(p,sz){sz=sz||18;var k=p==='이선주'?'선':p?p[0]:'?';var cls=p==='이선주'?'av-선':(p&&p.indexOf('정')>=0?'av-정':'av-이');return '<span class="av '+cls+'" style="width:'+sz+'px;height:'+sz+'px;font-size:'+(sz*.45)+'px;margin-right:4px">'+k+'</span>'+p;}
function avCls(p){return p==='이선주'?'av-선':(p&&p.indexOf('정')>=0?'av-정':'av-이');}
function avKey(p){return p==='이선주'?'선':p?p[0]:'';}
function statusBadge(s){var m={'완료':'s-완료','진행 중':'s-진행중','예정':'s-예정','확인 대기':'s-확인대기','보류':'s-보류'};return s&&m[s]?'<span class="'+m[s]+'">'+s+'</span>':'';}
function fmtM(n){if(!n)return '—';return (n/10000).toLocaleString()+'만원';}
function fmtFull(n){if(!n)return '—';return n.toLocaleString()+'원';}
function moneyValue(v){return parseInt(String(v||'').replace(/[^\d-]/g,''),10)||0;}
function moneyText(v){var n=moneyValue(v);return n?n.toLocaleString():'';}
function moneyInput(el){el.value=moneyText(el.value);}
function shortSite(s){if(!s)return '—';return s.replace('경상북도 ','').replace('서울시 ','').replace('대구시 ','').replace('부산시 ','').replace('경산시 ','').replace(' 개령면','').replace(' 동래구','').replace(' 성동구','').replace(' 수성구','').replace(' 북구','').replace(' 동구','');}
function progColor(stage){return {'완공':'fill-green','인테리어':'fill-green','착공':'fill-green','골조':'fill-blue','인허가':'fill-amber'}[stage]||'fill-purple';}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function calcProgress(s){
  var base={'설계':8,'인허가':22,'착공':38,'골조':55,'인테리어':75,'완공':100};
  if(s.stage==='완공')return 100;
  var v=base[s.stage]||5;
  var livePayments=activeList(s.payment);
  if(livePayments.length){
    var r=livePayments.filter(function(p){return p.done;}).length/livePayments.length;
    var cur=base[s.stage]||5;
    var nextStage=STAGE_ORDER[STAGE_ORDER.indexOf(s.stage)+1];
    var nxt=nextStage?base[nextStage]||100:100;
    v=Math.round(cur+(nxt-cur)*r*0.6);
  }
  var liveDesignItems=s.designFee?activeList(s.designFee.items):[];
  if(liveDesignItems.length&&liveDesignItems.every(function(i){return i.done;})){v=Math.min(v+5,99);}
  return Math.min(v,99);
}

  var completedSites=sites.filter(function(s){return s.stage==='완공';});
  var stageIndex=document.getElementById('site-stage-index');
  if(stageIndex){
    stageIndex.innerHTML='<span class="site-person-index-label">현장 구분</span>'+
      '<button class="filter-btn '+(siteCompletionFilter==='진행'?'on':'')+'" onclick="setSiteCompletionFilter(\'진행\')">진행 현장 <span style="opacity:.72">'+activeSites.length+'</span></button>'+
      '<button class="filter-btn '+(siteCompletionFilter==='완공'?'on':'')+'" onclick="setSiteCompletionFilter(\'완공\')">완공 현장 <span style="opacity:.72">'+completedSites.length+'</span></button>';
  }
  var grouped=siteCompletionFilter==='완공'?completedSites:activeSites;
  var index=document.getElementById('site-person-index');
  if(index){
    index.innerHTML='<span class="site-person-index-label">담당자별 보기</span>'+['전체'].concat(PERSONS).map(function(p){
      return '<button class="filter-btn '+(sitePersonFilter===p?'on':'')+'" onclick="setSitePersonFilter(\''+p+'\')">'+p+' <span style="opacity:.72">'+(p==='전체'?grouped.length:grouped.filter(function(s){return s.person===p;}).length)+'</span></button>';
    }).join('');
  }
  var filtered=sitePersonFilter==='전체'?grouped:grouped.filter(function(s){return s.person===sitePersonFilter;});
  var html=filtered.map(function(s){
    var p=calcProgress(s);
    return '<div class="site-card" onclick="openSiteModal(\''+s.id+'\')">'+
      '<div class="site-card-top"><div class="site-name">'+(s.short||s.name)+'</div>'+stageBadge(s.stage)+'</div>'+
      '<div class="site-meta">'+
        '<span class="av '+avCls(s.person)+'" style="vertical-align:middle;margin-right:4px;width:17px;height:17px;font-size:7.5px">'+avKey(s.person)+'</span>'+
        s.person+(s.py?' · '+s.py+'평':'')+' · '+s.partner+
      '</div>'+
      '<div><span class="site-company">'+(s.company||'')+'</span></div>'+
      '<div class="site-progress">'+
        '<div class="progress-label"><span>진행률</span><span>'+p+'%</span></div>'+
        '<div class="progress-bar"><div class="progress-fill '+progColor(s.stage)+'" style="width:'+p+'%"></div></div>'+
      '</div>'+
    '</div>';
  }).join('');
  if(siteCompletionFilter==='진행'){
    html+='<div class="site-add-card" onclick="openNewSiteForm()"><i class="ti ti-plus" style="font-size:22px"></i><span>현장 추가</span></div>';
  }else if(!filtered.length){
    html+='<div style="grid-column:1/-1;text-align:center;padding:48px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text3)"><i class="ti ti-building-check" style="display:block;font-size:28px;margin-bottom:8px"></i>완공 현장이 없어요</div>';
  }
  el.innerHTML=html;
}

function setSiteCompletionFilter(group){
  siteCompletionFilter=group;
  sitePersonFilter='전체';
  renderGrid();
}

function setSitePersonFilter(person){
  sitePersonFilter=person;
  renderGrid();
}

    if(isCur)h+='<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:#d1fae5;color:#065f46;font-weight:700">현재</span>';
    h+='<i class="ti ti-chevron-down" id="tc_'+siteId+'_'+bi+'" style="font-size:15px;color:var(--text3);transition:transform .2s;'+(isOpen?'transform:rotate(180deg)':'')+'"></i></div></div><div class="timing-body'+(isOpen?' open':'')+'" id="tb_'+siteId+'_'+bi+'">';

// ── 헤더 저장/삭제 버튼 ───────────────────────────────
function saveSiteFromModal(){
  var id=window._modalSiteId;
  if(!id)return;
  var s=sites.find(function(x){return x.id===id;});
  if(!s)return;
  var ta=document.getElementById('memo_'+id);
  if(ta)s.memo=ta.value;
  save('sites',sites);
  showToast('저장됐어요 ✓');
  var el=document.getElementById('memo-saved-'+id);
  if(el){el.style.opacity=1;setTimeout(function(){el.style.opacity=0;},2000);}
}

function deleteSiteFromModal(){
  // DOM과 window 변수 둘 다 확인
  var id = document.getElementById('modal').getAttribute('data-site-id') || window._modalSiteId;
  if(!id){showToast('오류: 현장 ID를 찾을 수 없어요');return;}
  var s=sites.find(function(x){return x.id===id;});
  if(!s){showToast('오류: 현장을 찾을 수 없어요');return;}
  if(!confirm((s.short||s.name)+' 현장을 삭제할까요?'))return;
  sites=sites.filter(function(x){return x.id!==id;});
  save('sites',sites);
  closeModal();
  renderAll();
  showToast('현장이 삭제됐어요');
}

// ── 현장 수정 폼 ───────────────────────────────────────
function openSiteEditForm(id){
  var s=sites.find(function(x){return x.id===id;});
  if(!s)return;
  document.getElementById('form-title').textContent='현장 정보 수정';
  var stO=STAGE_ORDER.map(function(st){return '<option value="'+st+'" '+(s.stage===st?'selected':'')+'>'+st+'</option>';}).join('');
  var pO=PERSONS.map(function(p){return '<option value="'+p+'" '+(s.person===p?'selected':'')+'>'+p+'</option>';}).join('');
  var cO=COMPANIES.map(function(c){return '<option value="'+c+'" '+((s.company||'')==c?'selected':'')+'>'+c+'</option>';}).join('');
  document.getElementById('form-body').innerHTML=
    '<div class="form-group"><label class="form-label">현장 약칭</label><input class="form-input" id="si-short" value="'+(s.short||s.name)+'"></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">공정단계</label><select class="form-input" id="si-stage">'+stO+'</select></div>'+
    '<div class="form-group"><label class="form-label">담당자</label><select class="form-input" id="si-person">'+pO+'</select></div></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">계약 규모 (평)</label><input class="form-input" id="si-py" type="number" value="'+(s.py||'')+'"></div>'+
    '<div class="form-group"><label class="form-label">협력업체</label><input class="form-input" id="si-partner" value="'+s.partner+'"></div></div>'+
    '<div class="form-group"><label class="form-label">계약 법인</label><select class="form-input" id="si-company">'+cO+'</select></div>'+
    '<div class="form-group"><label class="form-label">현장 소장</label><input class="form-input" id="si-siteManager" value="'+(s.siteManager||'')+'" placeholder="예) 홍길동 소장"></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">착공 예정일</label><input class="form-input" id="si-start" type="date" value="'+(s.start?s.start.replace(/\//g,'-'):'')+'"></div>'+
    '<div class="form-group"><label class="form-label">완공 예정일</label><input class="form-input" id="si-end" type="date" value="'+(s.end?s.end.replace(/\//g,'-'):'')+'"></div></div>'+
    '<div style="display:flex;gap:10px;margin-top:4px">'+
    '<button class="btn-primary" onclick="saveSiteEdit(\''+id+'\')">저장</button>'+
    '<button class="btn-secondary" onclick="closeForm()">닫기</button></div>';
  document.getElementById('form-bg').classList.add('open');
}

function saveSiteEdit(id){
  var s=sites.find(function(x){return x.id===id;});
  if(!s)return;
  s.short=document.getElementById('si-short').value.trim()||s.name;
  s.stage=document.getElementById('si-stage').value;
  s.person=document.getElementById('si-person').value;
  s.py=parseInt(document.getElementById('si-py').value)||0;
  s.partner=document.getElementById('si-partner').value;
  s.company=document.getElementById('si-company').value;
  s.siteManager=document.getElementById('si-siteManager').value;
  var sv=document.getElementById('si-start').value;
  var ev=document.getElementById('si-end').value;
  s.start=sv?sv.replace(/-/g,'/'):'';
  s.end=ev?ev.replace(/-/g,'/'):'';
  save('sites',sites);
  closeForm();
  renderAll();
  openSiteModal(id);
  showToast('저장됐어요 ✓');
}

function completeSite(id){
  var s=sites.find(function(x){return x.id===id;});
  if(!s||s.stage==='완공')return;
  if(!confirm((s.short||s.name)+' 현장을 완공 단계로 변경할까요?'))return;
  s.stage='완공';
  save('sites',sites);
  renderAll();
  openSiteModal(id);
  showToast('완공 단계로 변경됐어요 ✓');
}

// ── 현장 추가 폼 ───────────────────────────────────────
function openNewSiteForm(){

function saveNewSite(){
  var name=document.getElementById('ns-name').value.trim();
  if(!name){showToast('현장 주소를 입력해주세요');return;}
  var sv=document.getElementById('ns-start').value;
  var ev=document.getElementById('ns-end').value;
  var ns={
    id:uid(),
    name:name,
    short:document.getElementById('ns-short').value.trim()||name,
    stage:document.getElementById('ns-stage').value,
    py:parseInt(document.getElementById('ns-py').value)||0,
    person:document.getElementById('ns-person').value,
    partner:document.getElementById('ns-partner').value||'—',
    company:document.getElementById('ns-company').value,
    siteManager:document.getElementById('ns-siteManager').value,
    start:sv?sv.replace(/-/g,'/'):'',
    end:ev?ev.replace(/-/g,'/'):'',
    memo:document.getElementById('ns-memo').value,
    payment:[],
    designFee:null
  };
  sites.push(ns);
  save('sites',sites);
  closeForm();
  renderAll();
  showToast("'"+ns.short+"' 현장이 추가됐어요 ✓");
}

// ── 디자인비 모달 ──────────────────────────────────────
function openDesignFeeModal(id){

    var w=document.getElementById('df-items-list');

// ── 납부 토글/삭제 ──────────────────────────────────────
function toggleDI(id,ii){
  var s=sites.find(function(x){return x.id===id;});
  if(!s||!s.designFee)return;
  s.designFee.items[ii].done=!s.designFee.items[ii].done;
  save('sites',sites);
  openSiteModal(id);
}
function deleteDI(id,ii){
  if(!confirm('삭제?'))return;
  var s=sites.find(function(x){return x.id===id;});
  if(!s||!s.designFee)return;
  s.designFee.items[ii]=tombstoneItem(s.designFee.items[ii]);
  save('sites',sites);
  openSiteModal(id);
}
function togglePay(id,pi){
  var s=sites.find(function(x){return x.id===id;});
  if(!s||!s.payment[pi])return;
  s.payment[pi].done=!s.payment[pi].done;
  if(s.payment[pi].done){
    var t=new Date();
    s.payment[pi].paidDate=t.getFullYear()+'/'+(String(t.getMonth()+1).padStart(2,'0'))+'/'+String(t.getDate()).padStart(2,'0');
  }
  save('sites',sites);
  openSiteModal(id);
}
function deletePay(id,pi){
  if(!confirm('삭제?'))return;
  var s=sites.find(function(x){return x.id===id;});
  if(!s)return;
  s.payment[pi]=tombstoneItem(s.payment[pi]);
  save('sites',sites);
  openSiteModal(id);
}
function toggleBlock(sid,bi){
  var k=sid+'_'+bi;
  openBlocks[k]=!openBlocks[k];
  var b=document.getElementById('tb_'+sid+'_'+bi);
  var c=document.getElementById('tc_'+sid+'_'+bi);
  if(b)b.className='timing-body'+(openBlocks[k]?' open':'');
  if(c)c.style.transform=openBlocks[k]?'rotate(180deg)':'';
}
function toggleCheck(sid,bi,ii,chk){
  if(!checkState[sid])checkState[sid]={};
  checkState[sid][bi+'_'+ii]=chk;
  var l=document.getElementById('cl_'+sid+'_'+bi+'_'+ii);
  if(l)l.className='check-label'+(chk?' done':'');
  var t=document.getElementById('tp_'+sid+'_'+bi);
  if(t){
    var bl=TIMING[bi];
    var d=bl.items.filter(function(_,i){return checkState[sid]&&checkState[sid][bi+'_'+i];}).length;
    t.textContent=d+'/'+bl.items.length;
  }
  save('checks',checkState);
}
function saveMemo(id){
  var ta=document.getElementById('memo_'+id);
  if(!ta)return;
  var s=sites.find(function(x){return x.id===id;});
  if(!s)return;
  s.memo=ta.value;
  save('sites',sites);
  var el=document.getElementById('memo-saved-'+id);
  if(el){el.style.opacity=1;setTimeout(function(){el.style.opacity=0;},2000);}
  showToast('메모가 저장됐어요 ✓');
}

// ── 파일 업로드 ────────────────────────────────────────
function setupDragDrop(areaId,inputId,statusId,dataId,isDesign){
  var area=document.getElementById(areaId); if(!area)return;
  area.addEventListener('dragover',function(e){e.preventDefault();area.classList.add('drag-over');});
  area.addEventListener('dragleave',function(){area.classList.remove('drag-over');});
  area.addEventListener('drop',function(e){
    e.preventDefault();area.classList.remove('drag-over');
    var f=e.dataTransfer.files[0];if(f)processFile(f,statusId,dataId,isDesign,null);
  });
}

function handleFile(input,statusId,dataId,isDesign){
  var f=input.files[0];if(!f)return;
  processFile(f,statusId,dataId,isDesign,null);
}

function handleFileAndApply(input,statusId,dataId,isDesign,applyFn){
  var f=input.files[0];if(!f)return;
  processFile(f,statusId,dataId,isDesign,function(){
    if(window[applyFn])window[applyFn]();
  });
}

function processFile(file,statusId,dataId,isDesign,callback){
  var statusEl=document.getElementById(statusId);
  if(statusEl)statusEl.innerHTML='<div class="upload-status loading"><i class="ti ti-loader"></i> 문서를 분석하고 있어요...</div>';
  var isPdf=(file.type&&file.type.indexOf('pdf')>=0)||/\.pdf$/i.test(file.name||'');
  var payloadPromise=isPdf
    ? (statusEl&&(statusEl.innerHTML='<div class="upload-status loading"><i class="ti ti-loader"></i> PDF를 이미지로 변환해서 분석하고 있어요...</div>'),pdfFirstPageToImagePayload(file).catch(function(){return fileToBase64Payload(file);}))
    : fileToBase64Payload(file);
  payloadPromise.then(function(payload){
    return sheetExtract(payload.fileName||file.name||'',payload.mediaType||file.type||'image/jpeg',payload.base64,isDesign);
  })
    .then(function(parsed){
      if(document.getElementById(dataId))document.getElementById(dataId).value=JSON.stringify(parsed);

function parseYMD(v){
  if(!v || v==='날짜 없음')return null;
  var d=new Date(String(v).replace(/\//g,'-'));
  return isNaN(d.getTime())?null:d;
}
function fmtYMD(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function weekInfo(dateStr){
  var d=parseYMD(dateStr);
  if(!d)return {key:'nodate',label:'날짜 없음',start:null,end:null,isCurrent:false};
  var start=new Date(d); start.setHours(0,0,0,0);
  var day=start.getDay();
  var diff=(day===0?-6:1-day); // 월요일 시작
  start.setDate(start.getDate()+diff);
  var end=new Date(start); end.setDate(start.getDate()+6);
  var now=new Date(); now.setHours(0,0,0,0);
  var isCur=now>=start&&now<=end;
  var key=start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
  var label=fmtYMD(start)+' ~ '+fmtYMD(end)+(isCur?' · 이번 주':'');
  return {key:key,label:label,start:start,end:end,isCurrent:isCur};
}
function dayInfo(dateStr){
  var d=parseYMD(dateStr);
  if(!d)return {key:'nodate',label:'날짜 없음',date:null,isCurrent:false};
  d.setHours(0,0,0,0);
  var now=new Date(); now.setHours(0,0,0,0);
  var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var dayNames=['일','월','화','수','목','금','토'];
  var label=fmtYMD(d)+' ('+dayNames[d.getDay()]+')'+(d.getTime()===now.getTime()?' · 오늘':'');
  return {key:key,label:label,date:d,isCurrent:d.getTime()===now.getTime()};
}
function groupByDay(data){
  var g={};
  data.forEach(function(item){
    var d=dayInfo(item.date||'');
    if(!g[d.key])g[d.key]={info:d,rows:[]};
    g[d.key].rows.push(item);
  });
  var arr=Object.keys(g).map(function(k){return g[k];});
  arr.sort(function(a,b){
    if(a.info.key==='nodate')return 1;
    if(b.info.key==='nodate')return -1;
    return b.info.key.localeCompare(a.info.key);
  });
  arr.forEach(function(gr){
    gr.rows.sort(function(a,b){
      var au=Date.parse(a.updatedAt||a.createdAt||0)||0;
      var bu=Date.parse(b.updatedAt||b.createdAt||0)||0;
      return bu-au;
    });
  });
  return arr;
}
function groupByWeek(data,noDateFirst){
  var g={};
  data.forEach(function(item){
    var w=weekInfo(item.date||'');
    if(!g[w.key])g[w.key]={info:w,rows:[]};
    g[w.key].rows.push(item);
  });
  var arr=Object.keys(g).map(function(k){return g[k];});
  arr.sort(function(a,b){
    if(a.info.key==='nodate')return noDateFirst?-1:1;
    if(b.info.key==='nodate')return noDateFirst?1:-1;
    return b.info.key.localeCompare(a.info.key);
  });
  arr.forEach(function(gr){
    gr.rows.sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
  });
  return arr;
}
function isWeekOpen(type,key,isCurrent,idx){

  if(openWeeks[k]===undefined)openWeeks[k]=(isCurrent || idx===0);

function todayYMD(){
  var today=new Date();
  return today.getFullYear()+'/'+String(today.getMonth()+1).padStart(2,'0')+'/'+String(today.getDate()).padStart(2,'0');
}
function syncReportFromPlan(plan){
  if(!plan||!plan.id)return false;
  var nowIso=new Date().toISOString();
  var report=reports.find(function(r){return r.sourcePlanId===plan.id;});
  if(!report){
    report=reports.find(function(r){
      return r.fromPlan&&!r.sourcePlanId&&r.content===plan.content&&r.person===plan.person;
    });
  }
  if(report){
    report.content=plan.content;
    report.person=plan.person;
    report.status='완료';
    report.memo=plan.memo||'';
    report.site=plan.site||'';
    report.fromPlan=true;
    report.sourcePlanId=plan.id;
    report.updatedAt=nowIso;
    if(!report.date)report.date=todayYMD();
    return true;
  }
  reports.unshift({
    id:uid(),
    content:plan.content,
    date:todayYMD(),
    person:plan.person,
    status:'완료',
    memo:plan.memo||'',
    site:plan.site||'',
    fromPlan:true,
    sourcePlanId:plan.id,
    createdAt:nowIso,
    updatedAt:nowIso
  });
  return true;
}
function quickStatus(id){
  var plan=plans.find(function(x){return x.id===id;}); if(!plan)return;

  var prev=plan.status||'예정';if(prev==='확인 대기'||prev==='보류')prev='진행 중';
  var next=cycle[(cycle.indexOf(prev)+1)%cycle.length];

function chatDayLabel(iso){
  var d=iso?new Date(iso):new Date();
  if(isNaN(d.getTime()))d=new Date();
  var today=new Date();
  var yday=new Date();yday.setDate(today.getDate()-1);
  var same=function(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();};
  if(same(d,today))return '오늘';
  if(same(d,yday))return '어제';
  return d.getFullYear()+'. '+String(d.getMonth()+1).padStart(2,'0')+'. '+String(d.getDate()).padStart(2,'0');
}
function chatTimeLabel(iso){
  var d=iso?new Date(iso):new Date();
  if(isNaN(d.getTime()))d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function cacheChatMessages(){

  });

function mergeOneChatMessage(message){
  if(!message||!message.id)return;
  chatMessages=mergeById(chatMessages,[message]);
  cacheChatMessages();
}
function writeChatMessage(message){
  mergeOneChatMessage(message);
  if(!currentUser)return Promise.resolve(false);
  return chatMessageDoc(message.id).set({
    type:'chatMessage',
    message:message,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).then(function(){return true;}).catch(function(err){console.warn('chat save failed',err);return false;});
}
function mutateChatMessage(id,mutator){
  var local=chatMessages.find(function(m){return m.id===id;});
  if(!local)return Promise.resolve(null);
  var optimistic=mutator(JSON.parse(JSON.stringify(local)));
  optimistic.updatedAt=new Date().toISOString();
  mergeOneChatMessage(optimistic);
  if(!currentUser)return Promise.resolve(optimistic);
  var ref=chatMessageDoc(id);
  return FIREBASE_DB.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      var remote=snap.exists?(snap.data()||{}).message:null;
      var base=remote&&remote.id?remote:local;
      var next=mutator(JSON.parse(JSON.stringify(base)));
      next.updatedAt=new Date().toISOString();
      tx.set(ref,{type:'chatMessage',message:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      return next;
    });
  }).then(function(next){mergeOneChatMessage(next);return next;}).catch(function(err){console.warn('chat update failed',err);return optimistic;});
}
function chatReadLabel(message,person){
  if(message.person!==person)return '';
  var readers=(Array.isArray(message.readBy)?message.readBy:[]).filter(function(p){return p&&p!==message.person;});
  if(!readers.length)return '전송됨';
  return readers.length===1?'읽음 '+readers[0]:'읽음 '+readers.length+'명';
}
function markChatMessagesRead(person){
  var targets=activeList(chatMessages).filter(function(m){
    return m.person!==person&&!(Array.isArray(m.readBy)&&m.readBy.indexOf(person)>=0)&&!chatReadSaving[m.id];
  }).slice(-50);
  if(!targets.length)return;
  targets.forEach(function(m){
    chatReadSaving[m.id]=true;
    mutateChatMessage(m.id,function(base){
      var list=Array.isArray(base.readBy)?base.readBy.slice():[];
      if(list.indexOf(person)<0)list.push(person);
      base.readBy=list;
      return base;
    }).then(function(){delete chatReadSaving[m.id];});
  });
}

function prepareChatImage(input){
  var file=input&&input.files?input.files[0]:null;

  if(!/^image\//.test(file.type)){showToast('이미지 파일만 첨부할 수 있어요');input.value='';return;}

  showToast('이미지를 준비하고 있어요...');

  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var maxSide=1280,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      var canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      var quality=.82,data=canvas.toDataURL('image/jpeg',quality);

      if(data.length>CHAT_IMAGE_MAX_CHARS){showToast('이미지가 너무 커요. 더 작은 사진을 선택해주세요');input.value='';return;}
      pendingChatImage={dataUrl:data,name:(file.name||'사진').replace(/\.[^.]+$/,'')+'.jpg'};

    };
    img.onerror=function(){showToast('이미지를 읽지 못했어요');};
    img.src=reader.result;
  };
  reader.onerror=function(){showToast('이미지를 읽지 못했어요');};
  reader.readAsDataURL(file);
}

function getOrderSite(){
  var active=activeList(sites);
  if(!active.length)return null;
  var found=active.find(function(s){return s.id===currentOrderSiteId;});
  if(!found){found=active[0];currentOrderSiteId=found.id;}
  if(!Array.isArray(found.orderItems))found.orderItems=[];
  return found;
}
function orderStatusClass(status){
  return status==='발주완료'?'ordered':status==='입고완료'?'received':status==='보류'?'hold':'pending';
}
function orderCategoryList(items){
  var list=ORDER_CATEGORIES.slice();
  items.forEach(function(item){if(item.category&&list.indexOf(item.category)<0)list.push(item.category);});
  return list.filter(function(category){return items.some(function(item){return item.category===category;});});
}
